# Applies database migrations once per release, before the new pods take traffic.
# Running migrations from a Job, not from the pods, means replicas never race to migrate.
apiVersion: batch/v1
kind: Job
metadata:
  name: dispute-portal-api-migrate
  labels:
    app.kubernetes.io/name: dispute-portal-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispute-portal-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: dispute-portal-api
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: dispute-portal-api
            - secretRef:
                name: dispute-portal-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
