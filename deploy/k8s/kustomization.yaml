# Kubernetes manifests for the API. Apply with: kubectl apply -k deploy/k8s
#
# These show how the service is meant to run on a cluster. They have been validated against the
# Kubernetes schemas but not applied to a real cluster, and the image below is not published.
# Before applying, create the secret described in secret.example.yaml and set the image and the URLs in configmap.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dispute-portal

resources:
  - namespace.yaml
  - configmap.yaml
  - migration-job.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - autoscaling.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: dispute-portal
    includeSelectors: false

images:
  - name: dispute-portal-api
    newName: ghcr.io/majinbruu/dispute-portal-api
    newTag: "1.0.0"
