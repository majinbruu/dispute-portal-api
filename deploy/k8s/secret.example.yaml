# Example only. This file is not part of the kustomization and holds no real secret.
# In a real cluster the secret comes from a secret manager (for example External Secrets or Sealed Secrets),
# not from a file in git. To try the manifests locally:
#
#   kubectl -n dispute-portal create secret generic dispute-portal-api \
#     --from-literal=ConnectionStrings__Postgres='Host=...;Database=dispute_portal;Username=...;Password=...'
apiVersion: v1
kind: Secret
metadata:
  name: dispute-portal-api
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=CHANGE_ME;Port=5432;Database=dispute_portal;Username=CHANGE_ME;Password=CHANGE_ME"
